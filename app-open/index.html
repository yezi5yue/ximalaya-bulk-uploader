<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>在喜马拉雅 App 中打开</title>
<style>
:root{color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
     font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
     background:#f5f5f7;color:#1d1d1f;padding:24px;-webkit-text-size-adjust:100%}
.card{width:100%;max-width:380px;background:#fff;border-radius:16px;padding:28px 24px;text-align:center;
      box-shadow:0 2px 16px rgba(0,0,0,.06)}
.badge{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;
       background:#fff1ec;color:#c2401f;margin-bottom:14px}
h1{font-size:19px;font-weight:600;margin:0 0 8px;line-height:1.4;word-break:break-word}
p{font-size:14px;color:#6e6e73;margin:0 0 20px}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:12px;background:#f86442;color:#fff;
     font-size:16px;font-weight:600;text-decoration:none;cursor:pointer;
     -webkit-tap-highlight-color:transparent}
.btn:active{opacity:.85}
.hint{font-size:13px;color:#86868b;margin-top:20px;line-height:1.75;text-align:left}
.hint b{color:#1d1d1f;font-weight:600}
.warn{display:none;margin-top:16px;padding:12px 14px;border-radius:10px;background:#fff4e5;
      color:#8a5300;font-size:13px;text-align:left;line-height:1.7}
.err{display:none;margin-top:16px;padding:12px 14px;border-radius:10px;background:#fdeaea;
     color:#a32d2d;font-size:13px;text-align:left;line-height:1.7}
/* 转换工具（仅在未识别出目标时出现） */
.tool{display:none;text-align:left}
.tool p{margin:14px 0 8px;font-size:13px;color:#6e6e73}
.field{display:flex;gap:8px}
input{flex:1;min-width:0;padding:11px 12px;border:1px solid #d2d2d7;border-radius:10px;
      font-size:14px;font-family:inherit;background:#fff;color:#1d1d1f}
input:focus{outline:none;border-color:#f86442}
.gen{padding:11px 18px;border:0;border-radius:10px;background:#f86442;color:#fff;font-size:14px;
     font-weight:600;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.gen:active{opacity:.85}
.out{display:none;margin-top:14px}
.out code{display:block;word-break:break-all;background:#f5f5f7;border-radius:8px;padding:10px 12px;
          font-size:12px;margin-top:6px;line-height:1.6;
          font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.copy{margin-top:8px;padding:9px 14px;border:1px solid #d2d2d7;background:#fff;border-radius:8px;
      font-size:13px;cursor:pointer;color:#1d1d1f;font-family:inherit;-webkit-tap-highlight-color:transparent}
.tool-err{display:none;margin-top:10px;font-size:13px;color:#a32d2d;line-height:1.7}
.tool-err code{word-break:break-all;font-size:12px}
@media (prefers-color-scheme:dark){
 body{background:#000;color:#f5f5f7}
 .card{background:#1c1c1e;box-shadow:none}
 p{color:#98989d}
 .badge{background:#3a1f16;color:#ff9d7a}
 .hint{color:#8e8e93}.hint b{color:#f5f5f7}
 .warn{background:#3a2a10;color:#ffcf8a}
 .err{background:#3a1a1a;color:#ff9d9d}
 .tool p{color:#98989d}
 input{background:#2c2c2e;border-color:#3a3a3c;color:#f5f5f7}
 .out code{background:#2c2c2e}
 .copy{background:#2c2c2e;border-color:#3a3a3c;color:#f5f5f7}
 .tool-err{color:#ff9d9d}
}
</style>
</head>
<body>
<div class="card">
  <div class="badge" id="badge">喜马拉雅</div>
  <h1 id="title">在 App 中打开</h1>
  <p id="sub">正在尝试唤起喜马拉雅 App…</p>
  <a class="btn" id="openBtn" href="#">打开喜马拉雅</a>
  <div class="warn" id="warn"></div>
  <div class="err" id="err"></div>

  <div class="tool" id="tool">
    <p>把喜马拉雅链接粘进来，生成可在手机上打开 App 的跳转链接：</p>
    <div class="field">
      <input id="inp" type="url" inputmode="url" autocomplete="off" spellcheck="false"
             placeholder="https://www.ximalaya.com/sound/1015366669">
      <button class="gen" id="gen" type="button">生成</button>
    </div>
    <div class="tool-err" id="toolErr"></div>
    <div class="out" id="out">
      <p style="margin:8px 0 0">跳转链接（手机点开即在 App 中播放）：</p>
      <code id="outCode"></code>
      <button class="copy" id="copy" type="button">复制链接</button>
    </div>
  </div>

  <div class="hint" id="hint">
    打不开时请检查：<br>
    1. 手机已安装喜马拉雅 App<br>
    2. App 内登录的是<b>音频所属账号</b>（私密内容只有该账号可见）
  </div>
</div>
<script>
(function () {
  var titleEl = document.getElementById('title');
  var subEl   = document.getElementById('sub');
  var btn     = document.getElementById('openBtn');
  var warnEl  = document.getElementById('warn');
  var errEl   = document.getElementById('err');
  var hintEl  = document.getElementById('hint');
  var toolEl  = document.getElementById('tool');
  var inpEl   = document.getElementById('inp');
  var outEl   = document.getElementById('out');
  var outCode = document.getElementById('outCode');
  var copyEl  = document.getElementById('copy');
  var toolErr = document.getElementById('toolErr');

  var autoPrompted = false;   // 本页只自动唤起一次，避免 hashchange 重复跳转

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // 容错：nginx merge_slashes 等可能把 "https://x" 压成 "https:/x"
  function normalize(s) {
    return String(s == null ? '' : s).trim().replace(/^(https?):\/+/i, '$1://');
  }

  // 从原始链接里取出 sound/album 的 id
  function extractFromRaw(raw) {
    var s = normalize(raw);
    var ma = s.match(/\/album\/(\d+)/i);
    if (ma) { return { kind: 'album', id: ma[1] }; }
    var ms = s.match(/\/sound\/(\d+)/i) || s.match(/\/track\/(\d+)/i);
    if (ms) { return { kind: 'track', id: ms[1] }; }
    return null;
  }

  // 解析优先级：显式短参数 > hash/path 里的原始链接 > ?u=
  function resolve() {
    var q = new URLSearchParams(location.search);
    if (q.get('a')) { return { kind: 'album', id: q.get('a') }; }
    if (q.get('t')) { return { kind: 'track', id: q.get('t') }; }

    var raw = '';
    if (location.hash && location.hash.length > 1) {
      raw = location.hash.slice(1);
    } else if (location.pathname && location.pathname.length > 1) {
      raw = location.pathname.slice(1);
    }
    if (!raw) { raw = q.get('u') || ''; }
    if (!raw) { return null; }

    try { raw = decodeURIComponent(raw); } catch (e) {}

    var hit = extractFromRaw(raw);
    if (hit) { return hit; }

    // hash 里也允许写成 #t=xxx / #a=xxx
    try {
      var hq = new URLSearchParams(raw);
      if (hq.get('a')) { return { kind: 'album', id: hq.get('a') }; }
      if (hq.get('t')) { return { kind: 'track', id: hq.get('t') }; }
    } catch (e) {}

    return { bad: normalize(raw) };
  }

  function showTool(msg, prefill) {
    titleEl.textContent = '喜马拉雅链接转换';
    subEl.textContent = '粘贴原始链接，生成可在手机上打开 App 的跳转链接';
    btn.style.display = 'none';
    hintEl.style.display = 'none';
    toolEl.style.display = 'block';
    if (msg) {
      errEl.style.display = 'block';
      errEl.innerHTML = msg;
    }
    if (prefill && !inpEl.value) { inpEl.value = prefill; }
  }

  function render() {
    // 每次重渲染都复位
    warnEl.style.display = 'none';
    warnEl.innerHTML = '';
    errEl.style.display = 'none';
    errEl.innerHTML = '';
    toolEl.style.display = 'none';
    hintEl.style.display = 'block';
    btn.style.display = 'block';
    subEl.textContent = '正在尝试唤起喜马拉雅 App…';

    var target = resolve();

    if (!target) { showTool(''); return; }
    if (target.bad) {
      showTool('没认出这个链接里的音频或专辑编号：<br><code>' +
               escapeHtml(target.bad.slice(0, 140)) + '</code>', target.bad);
      return;
    }

    var deep = target.kind === 'track'
      ? 'iting://open?msg_type=11&track_id=' + encodeURIComponent(target.id)
      : 'iting://open?msg_type=13&album_id=' + encodeURIComponent(target.id);

    var q = new URLSearchParams(location.search);
    var name = q.get('n');
    titleEl.textContent = name
      ? decodeURIComponent(name)
      : (target.kind === 'track' ? '喜马拉雅音频' : '喜马拉雅专辑');
    document.title = titleEl.textContent;

    btn.setAttribute('href', deep);
    btn.onclick = function (e) { e.preventDefault(); tryOpen(deep); };

    var ua = navigator.userAgent.toLowerCase();
    var isWx = ua.indexOf('micromessenger') !== -1;
    var isQq = ua.indexOf(' qq/') !== -1 || ua.indexOf('qqbrowser') !== -1;

    if (isWx) {
      subEl.textContent = '微信内无法自动唤起，请用浏览器打开';
      showFail('微信内无法直接唤起 App。请点右上角「…」→「在浏览器打开」，再点上方按钮。');
    } else if (!/android|iphone|ipad|ipod|harmony/i.test(ua)) {
      subEl.textContent = '请在手机上打开本链接';
      showFail('当前看起来是电脑浏览器，自定义协议无法唤起手机 App。请用手机打开本链接。');
    } else if (!autoPrompted) {
      autoPrompted = true;
      setTimeout(function () { tryOpen(deep); }, 350);
    }
  }

  function showFail(msg) {
    warnEl.style.display = 'block';
    warnEl.innerHTML = msg;
  }

  function tryOpen(deep) {
    var ua = navigator.userAgent.toLowerCase();
    var isWx = ua.indexOf('micromessenger') !== -1;
    var isQq = ua.indexOf(' qq/') !== -1 || ua.indexOf('qqbrowser') !== -1;

    var left = false;
    var mark = function () { left = true; };
    document.addEventListener('visibilitychange', mark);
    window.addEventListener('pagehide', mark);
    window.addEventListener('blur', mark);

    try { location.href = deep; } catch (e) {}

    setTimeout(function () {
      document.removeEventListener('visibilitychange', mark);
      window.removeEventListener('pagehide', mark);
      window.removeEventListener('blur', mark);
      if (left || document.hidden) { return; }
      if (isWx) {
        showFail('微信内无法直接唤起 App。请点右上角「…」→「在浏览器打开」，再点上方按钮。');
      } else if (isQq) {
        showFail('QQ 内可能拦截跳转。请点右上角菜单 →「在浏览器打开」，再点上方按钮。');
      } else {
        showFail('未能自动打开。请点击上方橙色按钮；若仍无反应，请确认已安装喜马拉雅 App。');
      }
    }, 1900);
  }

  // ---------- 转换工具 ----------
  document.getElementById('gen').addEventListener('click', function () {
    var v = normalize(inpEl.value);
    toolErr.style.display = 'none';
    if (!v) { toolErr.textContent = '请先粘贴链接'; toolErr.style.display = 'block'; return; }
    if (!extractFromRaw(v)) {
      toolErr.innerHTML = '没认出链接里的音频或专辑编号。支持这两种：<br>' +
        '<code>https://www.ximalaya.com/sound/1015366669</code><br>' +
        '<code>https://www.ximalaya.com/album/121805384</code>';
      toolErr.style.display = 'block';
      outEl.style.display = 'none';
      return;
    }
    outCode.textContent = location.origin + '/#' + v;
    outEl.style.display = 'block';
  });

  copyEl.addEventListener('click', function () {
    var t = outCode.textContent || '';
    if (!t) { return; }
    var done = function () {
      copyEl.textContent = '已复制';
      setTimeout(function () { copyEl.textContent = '复制链接'; }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(done, function () { fallbackCopy(t, done); });
    } else { fallbackCopy(t, done); }
  });

  function fallbackCopy(t, done) {
    var ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    document.body.removeChild(ta);
  }

  render();
  window.addEventListener('hashchange', render);
})();
</script>
</body>
</html>
